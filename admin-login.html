<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login – ExamZone</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
body {
  font-family:'Poppins',sans-serif;
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  position:relative; overflow:hidden;
}
body::before {
  content:''; position:absolute; inset:0;
  background-image: radial-gradient(circle at 20% 30%, rgba(37,99,235,0.3) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(245,158,11,0.15) 0%, transparent 50%);
}
.back { position:absolute; top:20px; left:20px; z-index:2; }
.back a { color:rgba(255,255,255,0.6); text-decoration:none; font-size:0.85rem; display:flex; align-items:center; gap:6px; transition:color 0.2s; }
.back a:hover { color:white; }
.card {
  background:rgba(255,255,255,0.07); backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.12); border-radius:20px;
  padding:48px 40px; width:100%; max-width:420px;
  position:relative; z-index:1; box-shadow:0 32px 80px rgba(0,0,0,0.4);
}
.brand { text-align:center; margin-bottom:36px; }
.brand .logo { font-size:2rem; font-weight:700; color:white; display:flex; align-items:center; justify-content:center; gap:10px; }
.brand .logo i { color:#f59e0b; }
.brand .logo b { color:#f59e0b; }
.brand p { color:rgba(255,255,255,0.5); font-size:0.85rem; margin-top:8px; }

.field { margin-bottom:20px; }
label { display:block; font-size:0.78rem; font-weight:600; color:rgba(255,255,255,0.6); margin-bottom:7px; text-transform:uppercase; letter-spacing:0.05em; }
.input-wrap { position:relative; }
.input-wrap i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.35); font-size:0.9rem; }
input {
  width:100%; padding:13px 16px 13px 42px;
  background:rgba(255,255,255,0.08); border:1.5px solid rgba(255,255,255,0.12);
  border-radius:10px; color:white; font-family:'Poppins',sans-serif; font-size:0.9rem;
  outline:none; transition:border-color 0.2s,background 0.2s;
}
input::placeholder { color:rgba(255,255,255,0.3); }
input:focus { border-color:#2563eb; background:rgba(255,255,255,0.12); }

.error {
  background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4);
  color:#fca5a5; padding:10px 14px; border-radius:8px;
  font-size:0.83rem; margin-bottom:16px; display:none; text-align:center;
}
.btn {
  width:100%; padding:14px;
  background:#2563eb; color:white; border:none; border-radius:10px;
  font-family:'Poppins',sans-serif; font-size:1rem; font-weight:600;
  cursor:pointer; transition:background 0.2s,transform 0.1s;
  margin-top:8px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.btn:hover { background:#1d4ed8; }
.btn:active { transform:scale(0.98); }
.hint { text-align:center; margin-top:20px; color:rgba(255,255,255,0.35); font-size:0.78rem; }
.hint strong { color:rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div class="back"><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Site</a></div>
<div class="card">
  <div class="brand">
    <div class="logo"><i class="fas fa-graduation-cap"></i> Exam<b>Zone</b></div>
    <p>Admin Panel — Secure Login</p>
  </div>
  <div class="error" id="error"><i class="fas fa-exclamation-circle"></i> Invalid credentials. Please try again.</div>
  <div class="field">
    <label>Username</label>
    <div class="input-wrap">
      <i class="fas fa-user"></i>
      <input type="text" id="username" placeholder="Enter username"/>
    </div>
  </div>
  <div class="field">
    <label>Password</label>
    <div class="input-wrap">
      <i class="fas fa-lock"></i>
      <input type="password" id="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')login()"/>
    </div>
  </div>
  <button class="btn" onclick="login()"><i class="fas fa-sign-in-alt"></i> Login to Dashboard</button>
  <div class="hint">Default: <strong>admin</strong> / <strong>admin123</strong></div>
</div>
<script>
  if (sessionStorage.getItem('adminLoggedIn')) window.location.href = 'admin-dashboard.html';
  function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    if (u === 'admin' && p === 'admin123') {
      sessionStorage.setItem('adminLoggedIn','true');
      window.location.href = 'admin-dashboard.html';
    } else {
      document.getElementById('error').style.display = 'block';
    }
  }
</script>
</body>
</html>
